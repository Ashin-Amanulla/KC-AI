name: Backend tests

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/src/lib/**', 'docs/schads-rules-implemented.md']
  pull_request:
    paths: ['backend/**', 'frontend/src/lib/**', 'docs/schads-rules-implemented.md']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run engine + module tests (includes invariants, golden fixtures, wage parity, docs drift)
        working-directory: backend
        run: npm test
