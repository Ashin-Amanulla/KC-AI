name: Deploy Backend to EC2

on:
  push:
    branches:
      - uat
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-uat-backend.yml'

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: kc-ai
  CONTAINER_NAME: kc-ai-uat-backend
  NETWORK_NAME: kc-ai-network
  ENV_FILE: /opt/kc-ai-uat/.env.uat

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: |
          npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            -f backend/Dockerfile \
            backend

      - name: Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          NETWORK_NAME: ${{ env.NETWORK_NAME }}
          ENV_FILE: ${{ env.ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          # Pass variables to the remote SSH session
          envs: REGISTRY,AWS_REGION,ECR_REPOSITORY,CONTAINER_NAME,NETWORK_NAME,ENV_FILE

          script: |
            set -e

            IMAGE=$REGISTRY/$ECR_REPOSITORY:latest

            echo "AWS_REGION=$AWS_REGION"
            echo "REGISTRY=$REGISTRY"

            echo "Logging into ECR..."
            aws ecr get-login-password --region $AWS_REGION | \
            sudo docker login \
              --username AWS \
              --password-stdin \
              $REGISTRY

            echo "Pulling latest image..."
            sudo docker pull $IMAGE

            echo "Stopping old container..."
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true

            echo "Starting new container..."
            sudo docker run -d \
              --name $CONTAINER_NAME \
              --network $NETWORK_NAME \
              -p 3002:3002 \
              --restart unless-stopped \
              --env-file $ENV_FILE \
              -e REDIS_URL=redis://kc-ai_redis:6379 \
              $IMAGE

            echo "Deployment successful."

            sudo docker ps
